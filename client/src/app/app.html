<app-header *ngIf="isLoggedIn"></app-header>
<app-header2 *ngIf="!isLoggedIn"></app-header2>
<router-outlet></router-outlet>
<app-footer></app-footer>
<div class="favorite-toast" *ngIf="wishlistService.toastMessage()" role="status" aria-live="polite">
  <i class="bi bi-heart" aria-hidden="true"></i>
  <span>{{ wishlistService.toastMessage() }}</span>
</div>

<div
  *ngIf="buyNowService.request() as request"
  class="buy-now-backdrop"
  (click)="buyNowService.close()">
  <section
    class="buy-now-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="buy-now-title"
    (click)="$event.stopPropagation()">
    <button
      type="button"
      class="buy-now-close"
      aria-label="Đóng"
      [disabled]="buyNowService.isSubmitting()"
      (click)="buyNowService.close()">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>

    <div class="buy-now-product">
      <img [src]="request.image" [alt]="request.product.name || request.product.title || 'Sản phẩm'">
      <div>
        <p class="buy-now-eyebrow">MUA NGAY</p>
        <h2 id="buy-now-title">{{ request.product.name || request.product.title }}</h2>
        <strong>{{ buyNowService.price | currency:'VND':'symbol':'1.0-0':'vi' }}</strong>
      </div>
    </div>

    <div class="buy-now-variants" *ngIf="request.product.variants?.length">
      <h3>Phân loại</h3>
      <div class="buy-now-variant-options">
        <button
          *ngFor="let variant of request.product.variants"
          type="button"
          class="buy-now-variant"
          [class.selected]="buyNowService.selectedVariant()?.sku === variant.sku"
          [disabled]="(variant.stock ?? 0) < 1 || buyNowService.isSubmitting()"
          [attr.aria-pressed]="buyNowService.selectedVariant()?.sku === variant.sku"
          (click)="buyNowService.selectVariant(variant)">
          {{ variant.label || 'Phân loại' }}
          <small *ngIf="(variant.stock ?? 0) < 1">Hết hàng</small>
        </button>
      </div>
    </div>

    <div class="buy-now-footer">
      <div class="buy-now-quantity" aria-label="Số lượng">
        <button
          type="button"
          aria-label="Giảm số lượng"
          [disabled]="buyNowService.quantity() <= 1 || buyNowService.isSubmitting()"
          (click)="buyNowService.changeQuantity(-1)">−</button>
        <span aria-live="polite">{{ buyNowService.quantity() }}</span>
        <button
          type="button"
          aria-label="Tăng số lượng"
          [disabled]="buyNowService.quantity() >= buyNowService.stock || buyNowService.isSubmitting()"
          (click)="buyNowService.changeQuantity(1)">+</button>
      </div>
      <button
        type="button"
        class="buy-now-confirm"
        [disabled]="buyNowService.stock < 1 || buyNowService.isSubmitting()"
        (click)="buyNowService.confirmPurchase()">
        <i class="bi bi-lightning-charge" aria-hidden="true"></i>
        {{ buyNowService.isSubmitting() ? 'Đang chuyển...' : 'Tiếp tục thanh toán' }}
      </button>
    </div>
    <p *ngIf="buyNowService.error()" class="buy-now-error" role="alert">{{ buyNowService.error() }}</p>
  </section>
</div>
