<div class="login-page">
  <div class="login-container">

    <!-- ============ FORM ĐĂNG NHẬP ============ -->
    <div class="login-form-container">
      <div class="form-heading">
        <h2>Đăng nhập</h2>
        <p class="form-description">Chào mừng bạn trở lại với Floralia.</p>
      </div>

      <form (ngSubmit)="login(loginForm)" #loginForm="ngForm" novalidate>

        <!-- Email -->
        <div class="form-field">
          <label for="loginEmail">Email</label>
          <div class="input-wrapper"
               [class.is-invalid]="emailCtrl.invalid && (emailCtrl.touched || loginForm.submitted)"
               [class.is-valid]="emailCtrl.valid && emailCtrl.touched">
            <i class="bi bi-envelope"></i>
            <input type="email" id="loginEmail" name="email"
                   [(ngModel)]="email" #emailCtrl="ngModel"
                   [pattern]="emailPattern" required
                   placeholder="Nhập địa chỉ email" autocomplete="email">
            <i class="bi bi-check-circle-fill state-icon ok" *ngIf="emailCtrl.valid && emailCtrl.touched"></i>
          </div>
          <div class="field-error" *ngIf="emailCtrl.invalid && (emailCtrl.touched || loginForm.submitted)">
            <i class="bi bi-exclamation-circle"></i>
            <span *ngIf="emailCtrl.errors?.['required']">Vui lòng nhập email.</span>
            <span *ngIf="!emailCtrl.errors?.['required'] && emailCtrl.errors?.['pattern']">
              Email chưa đúng định dạng (ví dụ: ten@gmail.com).
            </span>
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="form-field">
          <label for="loginPassword">Mật khẩu</label>
          <div class="input-wrapper"
               [class.is-invalid]="passCtrl.invalid && (passCtrl.touched || loginForm.submitted)"
               [class.is-valid]="passCtrl.valid && passCtrl.touched">
            <i class="bi bi-lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" id="loginPassword" name="password"
                   [(ngModel)]="password" #passCtrl="ngModel"
                   required minlength="8"
                   placeholder="Nhập mật khẩu" autocomplete="current-password">
            <button type="button" class="toggle-password" (click)="togglePassword()"
                    [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="field-error" *ngIf="passCtrl.invalid && (passCtrl.touched || loginForm.submitted)">
            <i class="bi bi-exclamation-circle"></i>
            <span *ngIf="passCtrl.errors?.['required']">Vui lòng nhập mật khẩu.</span>
            <span *ngIf="!passCtrl.errors?.['required'] && passCtrl.errors?.['minlength']">
              Mật khẩu phải có ít nhất 8 ký tự.
            </span>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <button type="button" class="forgot-password" (click)="forgotPassword()">Quên mật khẩu?</button>
        </div>

        <!-- Lỗi từ máy chủ / thông báo -->
        <div class="error-message" *ngIf="errorMessage" role="alert">
          <i class="bi bi-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>
        <div class="notice-message" *ngIf="notice" role="status">
          <i class="bi bi-info-circle"></i>
          <span>{{ notice }}</span>
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          <span *ngIf="!loading">Đăng nhập</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...
          </span>
        </button>
      </form>
      
      <div class="form-divider"><span>hoặc tiếp tục với</span></div>

      <div class="social-login">
        <button type="button" class="btn-social" (click)="socialLogin('facebook')">
          <i class="bi bi-facebook" style="color:#1877f2"></i>
          <span>Facebook</span>
        </button>
        <button type="button" class="btn-social" (click)="socialLogin('google')">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          <span>Google</span>
        </button>
      </div>
      <div class="signup-text">
        Bạn chưa có tài khoản?
        <button type="button" (click)="goToSignup()">Đăng ký ngay</button>
      </div>
      
    </div>

  </div>
</div>
