<div class="login-page">
  <div class="login-decoration decoration-left"></div>
  <div class="login-decoration decoration-right"></div>

  <div class="login-container">

    <!-- Phần giới thiệu -->
    <div class="login-brand">
      <div class="brand-icon">
        <i class="bi bi-flower1"></i>
      </div>

      <p class="brand-name">Floralia</p>
      <span class="brand-subtitle">HERBAL TEA</span>

      <div class="brand-divider">
        <span></span>
        <i class="bi bi-leaf"></i>
        <span></span>
      </div>

      <p class="brand-message">
        Một tách trà dịu nhẹ,<br>
        một chút bình yên cho riêng mình.
      </p>
    </div>

    <!-- Form đăng nhập -->
    <div class="login-form-container">

      <div class="form-heading">
        <p class="sub-title">Chào mừng bạn trở lại</p>
        <h2>Đăng nhập</h2>
        <p class="form-description">
          Đăng nhập để tiếp tục khám phá thế giới trà thảo mộc Floralia.
        </p>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm">

        <!-- Email -->
        <div class="form-field">
          <label for="loginEmail">Email</label>

          <div class="input-wrapper">
            <i class="bi bi-envelope"></i>

            <input
              type="email"
              id="loginEmail"
              name="email"
              [(ngModel)]="email"
              placeholder="Nhập địa chỉ email"
              autocomplete="email"
              required
              email
            >
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="form-field">
          <label for="loginPassword">Mật khẩu</label>

          <div class="input-wrapper">
            <i class="bi bi-lock"></i>

            <input
              [type]="showPassword ? 'text' : 'password'"
              id="loginPassword"
              name="password"
              [(ngModel)]="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <i
                class="bi"
                [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
              ></i>
            </button>
          </div>
        </div>

        <!-- Tùy chọn -->
        <div class="form-options">
          <label class="remember-me">
            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="rememberMe"
            >
            <span>Ghi nhớ mật khẩu</span>
          </label>

          <button
            type="button"
            class="forgot-password"
            (click)="forgotPassword()"
          >
            Quên mật khẩu?
          </button>
        </div>

        <!-- Thông báo lỗi -->
        <div class="error-message" *ngIf="errorMessage">
          <i class="bi bi-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Nút đăng nhập -->
        <button
          type="submit"
          class="btn-login"
         
        >
          <span *ngIf="!loading">
            Đăng nhập
          </span>

          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Đang đăng nhập...
          </span>
        </button>

      </form>

      <!-- Đăng ký -->
      <div class="signup-text">
        Bạn chưa có tài khoản?
        <button type="button" (click)="goToSignup()">
          Đăng ký ngay
        </button>
      </div>

      <div class="form-divider">
        <span>FLORALIA HERBAL TEA</span>
      </div>

      <p class="login-note">
        <i class="bi bi-heart"></i>
        Cảm ơn bạn đã lựa chọn Floralia.
      </p>

    </div>
  </div>
</div>
