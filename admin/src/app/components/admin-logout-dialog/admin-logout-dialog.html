<div *ngIf="visible" class="logout-confirm-backdrop" (click)="cancelled.emit()">
  <section
    class="logout-confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="logoutConfirmTitle"
    (click)="$event.stopPropagation()"
  >
    <span class="logout-confirm-icon"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></span>
    <h2 id="logoutConfirmTitle">Xác nhận đăng xuất</h2>
    <p>Bạn có chắc chắn muốn đăng xuất khỏi trang quản trị không?</p>
    <div class="logout-confirm-actions">
      <button type="button" class="logout-cancel-button" (click)="cancelled.emit()">Ở lại</button>
      <button type="button" class="logout-submit-button" (click)="confirmed.emit()">Đăng xuất</button>
    </div>
  </section>
</div>
