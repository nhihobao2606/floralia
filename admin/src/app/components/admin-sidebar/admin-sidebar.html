<aside class="admin-sidebar">
  <a class="sidebar-brand" routerLink="/articles" aria-label="Floralia Tea - quản trị">
    <img src="/assets/logo.png" alt="Floralia Tea">
  </a>

  <nav class="sidebar-nav" aria-label="Menu quản trị">
    <a
      *ngFor="let item of menu"
      class="sidebar-link"
      [class.active]="!item.disabled"
      [class.disabled]="item.disabled"
      [routerLink]="item.disabled ? null : '/articles'"
      [attr.aria-label]="item.label"
      [attr.aria-disabled]="item.disabled"
      [attr.title]="item.disabled ? 'Mục này sẽ được triển khai sau' : null">
      <i [ngClass]="['bi', item.icon]" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

</aside>
