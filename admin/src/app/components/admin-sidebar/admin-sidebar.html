<aside class="admin-sidebar" [class.collapsed]="isCollapsed">
  <a class="sidebar-brand" routerLink="/overview" aria-label="Floralia Tea - quản trị">
    <img src="/assets/logo1.png" alt="Floralia Tea">
    <i class="sidebar-brand-mark bi bi-flower1" aria-hidden="true"></i>
  </a>

  <nav class="sidebar-nav" aria-label="Menu quản trị">
    <a
      *ngFor="let item of menu"
      class="sidebar-link"
      [class.disabled]="item.disabled"
      [routerLink]="item.disabled ? null : item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      [attr.aria-label]="item.label"
      [attr.title]="isCollapsed ? item.label : null"
      [attr.aria-disabled]="item.disabled">
      <i [ngClass]="['bi', item.icon]" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <button
    class="sidebar-toggle"
    type="button"
    [attr.aria-label]="isCollapsed ? 'Mở rộng thanh bên' : 'Thu gọn thanh bên'"
    [attr.title]="isCollapsed ? 'Mở rộng thanh bên' : 'Thu gọn thanh bên'"
    [attr.aria-expanded]="!isCollapsed"
    (click)="toggleSidebar()">
    <i class="bi" [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'" aria-hidden="true"></i>
    <span>{{ isCollapsed ? 'Mở rộng' : 'Thu gọn' }}</span>
  </button>
</aside>
