<div class="select-root" [class.is-open]="open" [class.is-disabled]="disabled" [class.compact]="compact">
  <button #trigger class="select-trigger" type="button" [disabled]="disabled" [attr.aria-label]="ariaLabel || placeholder" [attr.aria-expanded]="open" aria-haspopup="listbox" (click)="toggle()">
    <span [class.placeholder]="!selectedLabel">{{ selectedLabel || placeholder }}</span>
    <i class="bi bi-chevron-up" aria-hidden="true"></i>
  </button>
  <div class="select-menu" *ngIf="open && !fixedMenu" role="listbox" [attr.aria-label]="ariaLabel || placeholder" [style.max-height.px]="maxMenuHeight">
    <button class="select-option" type="button" role="option" *ngFor="let option of normalizedOptions" [class.selected]="option.value === value" [attr.aria-selected]="option.value === value" (click)="select(option)">{{ option.label }}</button>
    <div class="select-empty" *ngIf="!normalizedOptions.length">Chưa có lựa chọn</div>
  </div>
</div>
